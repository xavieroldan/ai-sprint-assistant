name: User story
description: A small, valuable piece of work for the sprint
labels: ["user story"]
body:
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <role>, I want <goal> so that <benefit>
      placeholder: As a team lead, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: One verifiable criterion per line, as a list. AI Sprint Assistant checks each one in the pull request.
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Story points
      options: ["1", "2", "3", "5", "8", "13"]
